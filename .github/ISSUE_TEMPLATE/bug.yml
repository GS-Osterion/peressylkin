name: Bug report
description: Something went wrong while moving a folder, moving it back, or in the program's windows
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues in English or Russian are both welcome.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Copy the program's message verbatim.
    validations:
      required: true
  - type: input
    id: folder
    attributes:
      label: Folder
      description: The path and whose folder it is (a game, a program). Feel free to replace personal parts of the path with ***.
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: "Run `Peressylkin.exe status <folder> --json` (in PowerShell: `& Peressylkin.exe status <folder> --json | Out-String`) and paste the result."
      render: json
  - type: input
    id: version
    attributes:
      label: Program and Windows version
      placeholder: "Peressylkin 1.1.0, Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Is your data intact?
      description: Is everything still there, either in the original folder or in the destination?
      options:
        - "Yes"
        - "No / not sure"
    validations:
      required: true
